<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>PlaybackRPR</title>
<script src="main.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0d0d;
  --surface:#1a1a1a;
  --surface2:#242424;
  --border:#2a2a2a;
  --text:#e0e0e0;
  --text2:#888;
  --accent:#4fc3f7;
  --accent-dim:#1a3f4f;
  --mute:#ef5350;
  --solo:#ffd740;
  --play:#66bb6a;
  --vol-track:#333;
  --vol-fill:#4fc3f7;
  --radius:8px;
  --font:system-ui,-apple-system,sans-serif;
  --safe-bottom:env(safe-area-inset-bottom,0px)
}
html,body{height:100%;background:var(--bg);color:var(--text);font:14px/1.4 var(--font);overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;max-width:600px;margin:0 auto}

.header{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;min-height:52px}
.header h1{font-size:16px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header h2{font-size:15px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-icon{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;padding:6px 10px;border-radius:var(--radius);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn-icon:active{background:var(--surface2);color:var(--text)}
.btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:var(--radius);cursor:pointer;font-size:13px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn:active{opacity:.7}

.view{display:none;flex-direction:column;flex:1;overflow:hidden}
.view.active{display:flex}
.scroll{flex:1;overflow-y:auto;padding:12px 16px;padding-bottom:calc(80px + var(--safe-bottom));-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:4px}
.scroll::-webkit-scrollbar-track{background:transparent}
.scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

#loading{display:flex;align-items:center;justify-content:center;flex:1;flex-direction:column;gap:12px;color:var(--text2);font-size:14px}
#loading .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.project-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:border-color .1s}
.project-item:active{border-color:var(--accent)}
.project-item .indicator{font-size:16px;color:var(--accent);flex-shrink:0;width:20px;text-align:center}
.project-item .indicator.inactive{color:var(--surface2)}
.project-item .indicator.playing{color:var(--play);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.project-item .name{flex:1;font-size:15px;font-weight:500}

.section-title{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px 4px}

.region-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:border-color .1s,background .15s}
.region-item:active{border-color:var(--accent)}
.region-item.active{border-color:var(--accent);background:var(--accent-dim)}
.region-item .rgn-marker{width:6px;height:32px;border-radius:3px;flex-shrink:0;background:var(--border)}
.region-item.active .rgn-marker{background:var(--accent)}
.region-item .rgn-info{flex:1;min-width:0}
.region-item .rgn-name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.region-item .rgn-time{font-size:11px;color:var(--text2);margin-top:2px}
.region-item .rgn-idx{font-size:11px;color:var(--accent);background:var(--accent-dim);padding:2px 8px;border-radius:4px;flex-shrink:0}
.region-item .rgn-queue-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--solo);color:#000;flex-shrink:0}
.region-item.queued{border-color:var(--solo)}

.track-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:6px}
.track-item .track-top{display:flex;align-items:center;gap:10px;min-height:36px}
.track-item .track-name{flex:1;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-item .track-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;flex-shrink:0}
.track-item .track-badge.muted{background:var(--mute);color:#fff}
.track-item .track-badge.soloed{background:var(--solo);color:#000}
.track-item .track-badge.both{background:linear-gradient(135deg,var(--mute) 50%,var(--solo) 50%);color:#fff}
.track-btns{display:flex;gap:6px;flex-shrink:0}
.track-btns button{background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:11px;font-weight:600;padding:6px 12px;border-radius:4px;cursor:pointer;touch-action:manipulation;min-width:40px;text-align:center;transition:all .1s}
.track-btns button:active{opacity:.7}
.track-btns button.mute-on{background:var(--mute);border-color:var(--mute);color:#fff}
.track-btns button.solo-on{background:var(--solo);border-color:var(--solo);color:#000}
.track-vol{display:flex;align-items:center;gap:10px;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.track-vol input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;background:linear-gradient(to right,var(--vol-track) 0%,var(--vol-track) calc(200%/3 - 1px),var(--accent) calc(200%/3 - 1px),var(--accent) calc(200%/3 + 1px),var(--vol-track) calc(200%/3 + 1px),var(--vol-track) 100%);border-radius:2px;outline:none;cursor:pointer}
.track-vol input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--vol-fill);border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer}
.track-vol input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--vol-fill);border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer;border:none}
.track-vol .vol-label{font-size:12px;color:var(--text2);min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.track-vol .vol-db{font-size:10px;color:var(--text2);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}

#transport{background:var(--surface);border-top:1px solid var(--border);padding:8px 16px calc(8px + var(--safe-bottom));flex-shrink:0}
#progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#progress-wrap .time{font-size:12px;color:var(--text2);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:44px}
#progress-wrap .time-right{text-align:right}
#progress-bar{flex:1;height:4px;background:var(--border);border-radius:2px;position:relative;overflow:hidden}
#progress-fill{height:100%;background:var(--accent);border-radius:2px;width:0%;transition:width .1s linear}
#transport-btns{display:flex;justify-content:center;gap:8px}
#transport-btns button{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:20px;padding:10px 20px;border-radius:var(--radius);cursor:pointer;touch-action:manipulation;transition:background .1s;min-width:52px;text-align:center}
#transport-btns button:active{background:var(--accent-dim);border-color:var(--accent)}
#transport-btns button.play-btn{background:var(--play);border-color:var(--play);color:#fff}
#transport-btns button.btn-loop{font-size:18px;min-width:44px}
#transport-btns button.btn-loop.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}

#status{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.9);color:var(--text);padding:20px 28px;border-radius:var(--radius);z-index:100;text-align:center;font-size:14px;max-width:80vw;pointer-events:none}
#status.show{display:block}

.empty-state{text-align:center;padding:40px 20px;color:var(--text2)}
.empty-state .icon{font-size:40px;margin-bottom:12px}
.empty-state p{font-size:13px;line-height:1.6}

.fade-in{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>

<div id="app">
  <div id="loading">
    <div class="spinner"></div>
    <div>Connecting to REAPER...</div>
  </div>

  <!-- VIEW: Song List -->
  <div id="view-songs" class="view">
    <div class="header">
      <h1>PlaybackRPR</h1>
      <button class="btn-icon" id="btn-refresh" title="Refresh projects">&#8635;</button>
    </div>
    <div class="scroll" id="songs-scroll">
      <div id="project-list"></div>
    </div>
  </div>

  <!-- VIEW: Song Detail -->
  <div id="view-song" class="view">
    <div class="header">
      <button class="btn-icon" id="btn-back">&#8592;</button>
      <h2 id="song-title">Song</h2>
    </div>
    <div class="scroll" id="song-scroll">
      <div class="section-title">Regions</div>
      <div id="region-list"></div>
      <div class="section-title">Tracks</div>
      <div id="track-list"></div>
    </div>
    <div id="transport">
      <div id="progress-wrap">
        <span class="time" id="time-elapsed">0:00</span>
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <span class="time time-right" id="time-remaining">0:00</span>
      </div>
      <div id="transport-btns">
        <button id="btn-loop" title="Loop region" class="btn-loop">&#x21BB;</button>
        <button id="btn-prev" title="Previous region">&#9664;&#9664;</button>
        <button id="btn-stop" title="Stop">&#9632;</button>
        <button id="btn-play" title="Play" class="play-btn">&#9654;</button>
        <button id="btn-next" title="Next region">&#9654;&#9654;</button>
      </div>
    </div>
  </div>
</div>

<div id="status"></div>

<script>
// ──────────────────────────────────────────────────────────────
// CONFIGURATION
// ──────────────────────────────────────────────────────────────

// Paste the Command ID of session_bridge.lua here.
// In REAPER: Actions → Show action list → find the script →
// right-click → "Copy selected action Command ID"
const BRIDGE_CMD = "_RS6d0b2440741d18348f22c9d8f53132621310890b";

// Base command ID for "View: Go to project tab N".
// Vanilla REAPER: 40830 = tab 1, 40831 = tab 2, etc.
// Verify in Actions list: search "Go to project tab"
const TAB_CMD_BASE = 3122;

// ──────────────────────────────────────────────────────────────
// STATE
// ──────────────────────────────────────────────────────────────

const state = {
  projects: [],
  projectPlaystates: [],
  currentProjectIndex: 0,
  regions: [],
  tracks: [],
  transport: { playstate: 0, position: 0, positionStr: "0:00", isRepeatOn: 0 },
  activeRegionIdx: -1,
  view: "songs",
  loading: true,
  switchingTab: false,
  nextRegionId: null,
  _queueTriggerPos: null,
  loopActive: false,
  loopRegionId: null
};

// ──────────────────────────────────────────────────────────────
// INIT
// ──────────────────────────────────────────────────────────────

function init() {
  wwr_start();
  refreshProjects();
  wwr_req_recur("TRANSPORT", 100);
  wwr_req_recur("REGION", 1000);
  wwr_req_recur("TRACK", 2000);
  silentPoll();
}

function silentPoll() {
  wwr_req(BRIDGE_CMD);
  setTimeout(function() {
    fetch("playback_data.json?_=" + Date.now())
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.projects) {
          for (var i = 0; i < data.projects.length; i++) {
            state.projectPlaystates[data.projects[i].index] = data.projects[i].playstate || 0;
          }
        }
        var idx = data.currentIndex || 0;
        if (idx !== state.currentProjectIndex) {
          state.currentProjectIndex = idx;
          state.regions = [];
          state.tracks = [];
          state.activeRegionIdx = -1;
          state.nextRegionId = null;
          state._queueTriggerPos = null;
          state.loopActive = false;
          state.loopRegionId = null;
          if (state.view === "song") {
            var name = state.projects[idx] ? (state.projects[idx].name || "").replace(/\.RPP$/i, "") : "Song";
            document.getElementById("song-title").textContent = name;
            document.getElementById("region-list").innerHTML = '<div class="empty-state"><p>Loading regions...</p></div>';
            document.getElementById("track-list").innerHTML = '<div class="empty-state"><p>Loading tracks...</p></div>';
            wwr_req("REGION");
            wwr_req("TRACK");
          }
          if (state.view === "songs") renderProjects();
        }
        if (state.view === "songs") updatePlayIndicator();
      })
      .catch(function() {});
    setTimeout(silentPoll, 3000);
  }, 300);
}

// ──────────────────────────────────────────────────────────────
// WWR CALLBACK (single response per call)
// ──────────────────────────────────────────────────────────────

function wwr_onreply(results) {
  var lines = results.split("\n");
  var batch = ""; // "" | "region" | "track" | "marker"

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var tok = line.split("\t");
    var cmd = tok[0];

    if (cmd === "TRANSPORT") {
      var oldPs = state.transport.playstate;
      state.transport.playstate = parseInt(tok[1]) || 0;
      state.transport.position = parseFloat(tok[2]) || 0;
      state.transport.isRepeatOn = parseInt(tok[3]) || 0;
      state.transport.positionStr = tok[4] || formatTime(state.transport.position);
      if (state.nextRegionId !== null && state._queueTriggerPos !== null && state.transport.position >= state._queueTriggerPos - 0.5) {
        var qid = state.nextRegionId;
        state.nextRegionId = null;
        state._queueTriggerPos = null;
        wwr_req("SET/POS_STR/r" + qid);
        if (state.view === "song") renderRegions();
      }
      if (state.loopActive && state.loopRegionId !== null && state.nextRegionId === null) {
        var loopR = getRegionById(state.loopRegionId);
        if (loopR && state.transport.position >= loopR.end - 0.5) {
          wwr_req("SET/POS_STR/r" + loopR.id);
        }
      }
      updateTransportUI();
      if (state.view === "song") highlightActiveRegion();
      if (oldPs !== 0 && state.transport.playstate === 0) {
        state.nextRegionId = null;
        state._queueTriggerPos = null;
        state.loopActive = false;
        state.loopRegionId = null;
        var lb = document.getElementById("btn-loop");
        if (lb) lb.classList.toggle("on", false);
      }
    }

    else if (cmd === "REGION_LIST") {
      state.regions = [];
      batch = "region";
    }
    else if (cmd === "REGION" && batch === "region") {
      state.regions.push({
        name: tok[1] || "",
        id: parseInt(tok[2]) || 0,
        start: parseFloat(tok[3]) || 0,
        end: parseFloat(tok[4]) || 0,
        color: tok[5] || ""
      });
    }
    else if (cmd === "REGION_LIST_END" && batch === "region") {
      batch = "";
      if (state.view === "song") renderRegions();
    }

    else if (cmd === "NTRACK") {
      state.tracks = [];
      batch = "track";
    }
    else if (cmd === "TRACK") {
      if (batch !== "track") {
        state.tracks = [];
        batch = "track";
      }
      var flags = parseInt(tok[3]) || 0;
      state.tracks.push({
        index: parseInt(tok[1]) || 0,
        name: tok[2] || "",
        flags: flags,
        muted: (flags & 8) !== 0,
        soloed: (flags & 16) !== 0,
        volume: parseFloat(tok[4]) || 0,
        pan: parseFloat(tok[5]) || 0,
        meterPeak: parseInt(tok[6]) || -150,
        meterPos: parseInt(tok[7]) || -150
      });
    }

    else if (cmd === "MARKER_LIST") { batch = "marker"; }
    else if (cmd === "MARKER" && batch === "marker") { /* unused */ }
    else if (cmd === "MARKER_LIST_END") { batch = ""; }
  }

  // No end-of-list marker for tracks → render at end of batch
  if (batch === "track" && state.view === "song") {
    renderTracks();
  }
}

// ──────────────────────────────────────────────────────────────
// PROJECT LIST
// ──────────────────────────────────────────────────────────────

function refreshProjects() {
  if (BRIDGE_CMD === "_RSXXXXXXXXXXXXX") {
    showStatus("Set BRIDGE_CMD in playback.html");
    return;
  }
  wwr_req(BRIDGE_CMD);
  setTimeout(loadProjects, 500);
}

function loadProjects() {
  fetch("playback_data.json?_=" + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      state.projects = data.projects || [];
      state.currentProjectIndex = data.currentIndex || 0;
      state.loading = false;
      document.getElementById("loading").style.display = "none";
      showView("songs");
      renderProjects();
    })
    .catch(function() {
      if (state.loading) {
        document.getElementById("loading").innerHTML =
          '<div class="empty-state">' +
          '<div class="icon">&#9888;</div>' +
          '<p>Could not load project data.<br>' +
          'Make sure session_bridge.lua is registered<br>' +
          'in REAPER and BRIDGE_CMD is set correctly.</p>' +
          '<button class="btn" onclick="refreshProjects()" style="margin-top:12px">Retry</button>' +
          '</div>';
      }
    });
}

function renderProjects() {
  var el = document.getElementById("project-list");
  if (!state.projects || state.projects.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="icon">&#128247;</div><p>No open projects found.<br>Open project tabs in REAPER and tap Refresh.</p></div>';
    return;
  }
  var html = "";
  for (var i = 0; i < state.projects.length; i++) {
    var p = state.projects[i];
    var ps = state.projectPlaystates[i];
    var playing = ps === 1 || ps === 5;
    var isActive = i === state.currentProjectIndex;
    var isPlaying = isActive && playing;
    var name = (p.name || "").replace(/\.RPP$/i, "");
    html += '<div class="project-item" data-index="' + i + '">' +
      '<div class="indicator' + (isActive ? "" : " inactive") + (isPlaying ? " playing" : "") + '">' + (isActive ? "&#9654;" : "&#9632;") + '</div>' +
      '<div class="name">' + escapeHtml(name) + '</div>' +
      '</div>';
  }
  el.innerHTML = html;
  el.querySelectorAll(".project-item").forEach(function(item) {
    item.addEventListener("click", function() {
      selectProject(parseInt(item.dataset.index));
    });
  });
}

// ──────────────────────────────────────────────────────────────
// PLAY INDICATOR
// ──────────────────────────────────────────────────────────────

function updatePlayIndicator() {
  var items = document.querySelectorAll("#project-list .project-item");
  for (var i = 0; i < items.length; i++) {
    var indicator = items[i].querySelector(".indicator");
    if (!indicator) continue;
    var idx = parseInt(items[i].dataset.index);
    var ps = state.projectPlaystates[idx];
    var playing = ps === 1 || ps === 5;
    if (playing) {
      indicator.classList.add("playing");
    } else {
      indicator.classList.remove("playing");
    }
  }
}

// ──────────────────────────────────────────────────────────────
// SELECT PROJECT
// ──────────────────────────────────────────────────────────────

function selectProject(index) {
  if (state.switchingTab && index !== state.currentProjectIndex) return;
  var sameTab = index === state.currentProjectIndex;
  state.currentProjectIndex = index;
  state.regions = [];
  state.tracks = [];
  state.activeRegionIdx = -1;
  state.nextRegionId = null;
  state._queueTriggerPos = null;
  state.loopActive = false;
  state.loopRegionId = null;
  if (!sameTab) {
    state.switchingTab = true;
    wwr_req("" + (TAB_CMD_BASE + index));
  }
  showView("song", true);
  var name = state.projects[index] ? (state.projects[index].name || "").replace(/\.RPP$/i, "") : "Song";
  document.getElementById("song-title").textContent = name;
  document.getElementById("region-list").innerHTML = '<div class="empty-state"><p>Loading regions...</p></div>';
  document.getElementById("track-list").innerHTML = '<div class="empty-state"><p>Loading tracks...</p></div>';
  setTimeout(function() {
    state.switchingTab = false;
    wwr_req("REGION");
    wwr_req("TRACK");
  }, sameTab ? 0 : 500);
}

// ──────────────────────────────────────────────────────────────
// REGIONS
// ──────────────────────────────────────────────────────────────

function renderRegions() {
  var el = document.getElementById("region-list");
  if (!state.regions || state.regions.length === 0) {
    el.innerHTML = '<div class="empty-state"><p>No regions in this project.</p></div>';
    return;
  }
  var html = "";
  for (var i = 0; i < state.regions.length; i++) {
    var r = state.regions[i];
    var active = i === state.activeRegionIdx;
    var queued = r.id === state.nextRegionId;
    var looping = state.loopActive && active;
    var dur = r.end - r.start;
    var colorStyle = (r.color && r.color !== "0" && r.color !== "") ? "background:" + parseColor(r.color) : "";
    html += '<div class="region-item' + (active ? " active" : "") + (queued ? " queued" : "") + '" data-id="' + r.id + '" data-idx="' + i + '">' +
      '<div class="rgn-marker" style="' + colorStyle + '"></div>' +
      '<div class="rgn-info">' +
      '<div class="rgn-name">' + escapeHtml(r.name || "Region " + r.id) + '</div>' +
      '<div class="rgn-time">' + formatTime(r.start) + " - " + formatTime(r.end) + " (" + formatTime(dur) + ")" + '</div>' +
      '</div>' +
      (queued ? '<div class="rgn-queue-badge">NEXT</div>' : looping ? '<div class="rgn-queue-badge">LOOP</div>' : '<div class="rgn-idx">#' + r.id + '</div>') +
      '</div>';
  }
  el.innerHTML = html;
  el.querySelectorAll(".region-item").forEach(function(item) {
    item.addEventListener("click", function() {
      var id = parseInt(item.dataset.id);
      var isQueued = id === state.nextRegionId;
      var isActive = id === (state.regions[state.activeRegionIdx] || {}).id;
      var ps = state.transport.playstate;
      var playing = ps === 1 || ps === 5;
      if (isQueued) {
        state.nextRegionId = null;
        state._queueTriggerPos = null;
        renderRegions();
        showStatus("Queue cancelled");
      } else if (playing && state.activeRegionIdx >= 0 && !isActive) {
        state.nextRegionId = id;
        state._queueTriggerPos = state.regions[state.activeRegionIdx].end;
        wwr_req("SET/POS_STR/r" + id);
        state.loopActive = false;
        state.loopRegionId = null;
        document.getElementById("btn-loop").classList.toggle("on", false);
        renderRegions();
        showStatus("Queued: " + (getRegionById(id) || {}).name || "Region");
      } else {
        state.nextRegionId = null;
        state._queueTriggerPos = null;
        goToRegion(id);
        if (!playing) renderRegions();
      }
    });
  });
}

function highlightActiveRegion() {
  var pos = state.transport.position;
  var idx = -1;
  for (var i = 0; i < state.regions.length; i++) {
    var r = state.regions[i];
    if (pos >= r.start - 0.05 && pos < r.end) { idx = i; break; }
  }
  if (idx >= 0 && state.regions[idx].id === state.nextRegionId) {
    state.nextRegionId = null;
    state._queueTriggerPos = null;
    renderRegions();
    showStatus("Queue cancelled");
    return;
  }
  if (idx !== state.activeRegionIdx) {
    state.activeRegionIdx = idx;
    var items = document.getElementById("region-list").children;
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle("active", i === idx);
    }
  }
}

function getRegionById(id) {
  for (var i = 0; i < state.regions.length; i++) {
    if (state.regions[i].id === id) return state.regions[i];
  }
  return null;
}

function goToRegion(id) {
  state.nextRegionId = null;
  state._queueTriggerPos = null;
  wwr_req("SET/POS_STR/r" + id);
}

function goToNextRegion() {
  state.nextRegionId = null;
  state._queueTriggerPos = null;
  var pos = state.transport.position;
  for (var i = 0; i < state.regions.length; i++) {
    if (state.regions[i].start > pos + 0.1) {
      wwr_req("SET/POS_STR/r" + state.regions[i].id);
      return;
    }
  }
}

function goToPrevRegion() {
  state.nextRegionId = null;
  state._queueTriggerPos = null;
  var pos = state.transport.position;
  for (var i = state.regions.length - 1; i >= 0; i--) {
    if (state.regions[i].end < pos - 0.1) {
      wwr_req("SET/POS_STR/r" + state.regions[i].id);
      return;
    }
  }
}

// ──────────────────────────────────────────────────────────────
// TRACKS (event delegation)
// ──────────────────────────────────────────────────────────────

function renderTracks() {
  var el = document.getElementById("track-list");
  var tracks = state.tracks;
  if (!tracks || tracks.length === 0) {
    el.innerHTML = '<div class="empty-state"><p>No tracks.</p></div>';
    return;
  }
  var html = "";
  for (var i = 0; i < tracks.length; i++) {
    var t = tracks[i];
    if (t.index === 0) continue;
    html += renderTrackItem(t);
  }
  el.innerHTML = html || '<div class="empty-state"><p>No user tracks.</p></div>';
}

function renderTrackItem(t) {
  var badge = "";
  var badgeLabel = "";
  if (t.muted && t.soloed) { badge = "both"; badgeLabel = "M+S"; }
  else if (t.muted) { badge = "muted"; badgeLabel = "MUTED"; }
  else if (t.soloed) { badge = "soloed"; badgeLabel = "SOLO"; }

  var volVal = Math.round(Math.min(Math.max(t.volume, 0), 1.5) * 100);
  return '<div class="track-item" data-index="' + t.index + '">' +
    '<div class="track-top">' +
    '<div class="track-name">' + escapeHtml(t.name || "Track " + t.index) + '</div>' +
    (badge ? '<div class="track-badge ' + badge + '">' + badgeLabel + '</div>' : "") +
    '<div class="track-btns">' +
    '<button class="track-mute' + (t.muted ? " mute-on" : "") + '" data-action="mute">M</button>' +
    '<button class="track-solo' + (t.soloed ? " solo-on" : "") + '" data-action="solo">S</button>' +
    '</div>' +
    '</div>' +
    '<div class="track-vol">' +
    '<input type="range" min="0" max="150" value="' + volVal + '" step="1">' +
    '<span class="vol-label">' + Math.round(t.volume * 100) + '%</span>' +
    '<span class="vol-db">' + volumeToDB(t.volume) + '</span>' +
    '</div>' +
    '</div>';
}

// Event delegation for all track interactions
document.addEventListener("DOMContentLoaded", function() {
  document.getElementById("track-list").addEventListener("click", function(e) {
    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    var item = btn.closest(".track-item");
    if (!item) return;
    var idx = parseInt(item.dataset.index);
    var action = btn.dataset.action;

    if (action === "mute") {
      var t = getTrack(idx);
      if (t) t.muted = !t.muted;
      wwr_req("SET/TRACK/" + idx + "/MUTE/-1");
      btn.classList.toggle("mute-on", t ? t.muted : false);
      updateBadge(item, idx);
    } else if (action === "solo") {
      var t = getTrack(idx);
      if (t) t.soloed = !t.soloed;
      wwr_req("SET/TRACK/" + idx + "/SOLO/-1");
      btn.classList.toggle("solo-on", t ? t.soloed : false);
      updateBadge(item, idx);
    }
  });

  document.getElementById("track-list").addEventListener("input", function(e) {
    if (e.target.matches('input[type="range"]')) {
      var item = e.target.closest(".track-item");
      if (!item) return;
      var idx = parseInt(item.dataset.index);
      var val = parseInt(e.target.value) / 100;
      var t = getTrack(idx);
      if (t) t.volume = val;
      var label = item.querySelector(".vol-label");
      var db = item.querySelector(".vol-db");
      if (label) label.textContent = Math.round(val * 100) + "%";
      if (db) db.textContent = volumeToDB(val);
    }
  });

  document.getElementById("track-list").addEventListener("change", function(e) {
    if (e.target.matches('input[type="range"]')) {
      var item = e.target.closest(".track-item");
      if (!item) return;
      var idx = parseInt(item.dataset.index);
      var val = parseInt(e.target.value) / 100;
      var t = getTrack(idx);
      if (t) t.volume = val;
      wwr_req("SET/TRACK/" + idx + "/VOL/" + val.toFixed(4));
      setTimeout(function() { wwr_req("TRACK"); }, 150);
    }
  });
});

function getTrack(idx) {
  for (var i = 0; i < state.tracks.length; i++) {
    if (state.tracks[i].index === idx) return state.tracks[i];
  }
  return null;
}

function updateBadge(item, idx) {
  var t = getTrack(idx);
  if (!t) return;
  var existing = item.querySelector(".track-badge");
  if (t.muted || t.soloed) {
    var cls = "";
    var lbl = "";
    if (t.muted && t.soloed) { cls = "both"; lbl = "M+S"; }
    else if (t.muted) { cls = "muted"; lbl = "MUTED"; }
    else if (t.soloed) { cls = "soloed"; lbl = "SOLO"; }
    if (!existing) {
      var top = item.querySelector(".track-top");
      var name = item.querySelector(".track-name");
      var b = document.createElement("div");
      b.className = "track-badge " + cls;
      b.textContent = lbl;
      if (name) name.parentNode.insertBefore(b, name.nextSibling);
    } else {
      existing.className = "track-badge " + cls;
      existing.textContent = lbl;
    }
  } else {
    if (existing) existing.remove();
  }
}

// ──────────────────────────────────────────────────────────────
// TRANSPORT
// ──────────────────────────────────────────────────────────────

function updateTransportUI() {
  var pos = state.transport.position;
  var totalDur = 0;
  var activeRegion = null;
  for (var i = 0; i < state.regions.length; i++) {
    if (state.regions[i].start <= pos && state.regions[i].end > pos) {
      activeRegion = state.regions[i];
      break;
    }
  }
  if (activeRegion) {
    totalDur = activeRegion.end - activeRegion.start;
    var elapsed = pos - activeRegion.start;
    document.getElementById("progress-fill").style.width = Math.min((elapsed / totalDur) * 100, 100) + "%";
    document.getElementById("time-elapsed").textContent = formatTime(elapsed);
    document.getElementById("time-remaining").textContent = "-" + formatTime(Math.max(0, totalDur - elapsed));
  } else {
    totalDur = findTotalDuration();
    document.getElementById("progress-fill").style.width = totalDur > 0 ? Math.min((pos / totalDur) * 100, 100) + "%" : "0%";
    document.getElementById("time-elapsed").textContent = formatTime(pos);
    document.getElementById("time-remaining").textContent = totalDur > 0 ? "-" + formatTime(Math.max(0, totalDur - pos)) : formatTime(pos);
  }

  var playBtn = document.getElementById("btn-play");
  var ps = state.transport.playstate;
  if (ps === 1 || ps === 5) {
    playBtn.innerHTML = "&#x23F8;";
    playBtn.classList.add("play-btn");
  } else {
    playBtn.innerHTML = "&#x25B6;";
    playBtn.classList.add("play-btn");
  }
}

function findTotalDuration() {
  var max = 0;
  for (var i = 0; i < state.regions.length; i++) {
    if (state.regions[i].end > max) max = state.regions[i].end;
  }
  return max || 300;
}

// ──────────────────────────────────────────────────────────────
// VIEW MANAGEMENT
// ──────────────────────────────────────────────────────────────

function showView(view, isSwitching) {
  state.view = view;
  document.getElementById("view-songs").classList.toggle("active", view === "songs");
  document.getElementById("view-song").classList.toggle("active", view === "song");
  if (view === "song") {
    document.getElementById("btn-loop").classList.toggle("on", state.loopActive);
    if (!isSwitching) {
      var idx = state.currentProjectIndex;
      var name = state.projects[idx] ? (state.projects[idx].name || "").replace(/\.RPP$/i, "") : "Song";
      document.getElementById("song-title").textContent = name;
    }
  }
}

// ──────────────────────────────────────────────────────────────
// EVENT BINDING
// ──────────────────────────────────────────────────────────────

document.addEventListener("DOMContentLoaded", function() {
  document.getElementById("btn-refresh").addEventListener("click", function() {
    showStatus("Refreshing...");
    refreshProjects();
  });

  document.getElementById("btn-back").addEventListener("click", function() {
    showView("songs");
    renderProjects();
  });

  document.getElementById("btn-play").addEventListener("click", function() {
    var ps = state.transport.playstate;
    if (ps === 1 || ps === 5) { wwr_req("1016"); }
    else { wwr_req("1007"); }
  });

  document.getElementById("btn-stop").addEventListener("click", function() {
    wwr_req("1016");
    wwr_req("SET/POS_STR/0");
    state.nextRegionId = null;
    state._queueTriggerPos = null;
    state.loopActive = false;
    state.loopRegionId = null;
    document.getElementById("btn-loop").classList.toggle("on", false);
    if (state.view === "song") renderRegions();
  });
  document.getElementById("btn-prev").addEventListener("click", goToPrevRegion);
  document.getElementById("btn-next").addEventListener("click", goToNextRegion);
  document.getElementById("btn-loop").addEventListener("click", function() {
    state.loopActive = !state.loopActive;
    if (state.loopActive && state.activeRegionIdx >= 0) {
      var r = state.regions[state.activeRegionIdx];
      state.loopRegionId = r.id;
      wwr_req("SET/POS_STR/r" + r.id);
    } else {
      state.loopRegionId = null;
    }
    this.classList.toggle("on", state.loopActive);
    showStatus(state.loopActive ? "Loop on" : "Loop off");
    if (state.view === "song") renderRegions();
  });

  init();
});

// ──────────────────────────────────────────────────────────────
// UTILITY
// ──────────────────────────────────────────────────────────────

function formatTime(s) {
  if (isNaN(s) || s < 0) return "0:00";
  return Math.floor(s / 60) + ":" + ("0" + Math.floor(s % 60)).slice(-2);
}

function volumeToDB(v) {
  if (v <= 0) return "-inf";
  var db = 20 * Math.log10(v);
  return (db > 0 ? "+" : "") + db.toFixed(1) + "dB";
}

function escapeHtml(s) {
  if (!s) return "";
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function parseColor(c) {
  if (!c || c === "0" || c === "") return "";
  var n = parseInt(c, 16);
  if (isNaN(n)) return "";
  return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + ((n>>24&255)||255)/255 + ")";
}

var statusTimer = null;
function showStatus(m) {
  var el = document.getElementById("status");
  el.textContent = m;
  el.classList.add("show");
  if (statusTimer) clearTimeout(statusTimer);
  statusTimer = setTimeout(function() { el.classList.remove("show"); }, 2000);
}
</script>
